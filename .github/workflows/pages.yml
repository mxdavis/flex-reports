name: Deploy demo

# Deploys a release's tag to GitHub Pages. The Release workflow calls this for
# each new version. To roll back, run it by hand (Actions → Deploy demo → Run
# workflow) with an earlier tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to deploy (vX.Y.Z)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. v0.1.0)
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer one waits instead of cancelling the current deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
